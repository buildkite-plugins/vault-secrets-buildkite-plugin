name: "Vault Secrets"
description: "Expose build secrets stored in Vault to your jobs"
author: "@mikeknox, @buildkite-plugins"
public: true
requirements:
  - curl
  - bash
  - vault
configuration:
  properties:
    path:
      type: string
    server:
      type: string
    secret:
      type: string
    namespace:
      type: string
    output:
      enum:
        - 'yaml'
        - 'json'
    connection-retries:
      type: integer
      minimum: 0
      description: "Retry Vault login this many times while the server is unreachable (default 0)"
    connection-retry-delay:
      type: integer
      minimum: 1
      description: "Seconds to wait between connection retries (default 5)"
    unreachable-exit-code:
      type: integer
      minimum: 1
      maximum: 255
      description: "Exit code used when the Vault server is unreachable, for use with automatic retry (default 75)"
    debug:
      type: boolean
      description: "Enable detailed debug logging to troubleshoot Vault connection issues"
    auth:
      type: object
      properties:
        method:
          enum:
            - 'approle'
            - 'aws'
            - 'jwt'
            - ''
        role-id:
          type: string
        secret-env:
          type: string
        aws-role-name:
          type: string
        jwt-env:
          type: string
        jwt-role:
          type: string
    secrets:
      type: array
  additionalProperties: false
  required: [ auth ]
    

