name: "Vault Secrets"
description: "Expose build secrets stored in Vault to your jobs"
author: "@mikeknox, @buildkite-plugins"
public: true
requirements:
  - curl
  - bash
  - vault
configuration:
  properties:
    path:
      type: string
    server:
      type: string
    secret:
      type: string
    namespace:
      type: string
    output:
      enum:
        - 'yaml'
        - 'json'
    max-retries:
      type: integer
      minimum: 0
      description: "Sets VAULT_MAX_RETRIES: how many times the Vault CLI retries a request that fails with a connection error or 5xx response (Vault default 2)"
    debug:
      type: boolean
      description: "Enable detailed debug logging to troubleshoot Vault connection issues"
    auth:
      type: object
      properties:
        method:
          enum:
            - 'approle'
            - 'aws'
            - 'jwt'
            - ''
        role-id:
          type: string
        secret-env:
          type: string
        aws-role-name:
          type: string
        jwt-env:
          type: string
        jwt-role:
          type: string
    secrets:
      type: array
  additionalProperties: false
  required: [ auth ]
    

